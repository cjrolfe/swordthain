name: Deploy Playground

on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - ".github/workflows/deploy-playground.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-playground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::584000479246:role/swordthain-playground-ci
          aws-region: us-east-1

      - name: Sync frontend to S3
        working-directory: apps/playground
        run: |
          # Scoped per-directory, NOT a single top-level `sync --delete .`:
          # the bucket also holds content the create_company/create_project
          # Lambda writes straight to S3 at runtime (e.g. <company-id>/index.html,
          # <company-id>/<project-id>/index.html) that never exists in this git
          # checkout. A single bucket-wide `--delete` sync would remove all of
          # that on every deploy — confirmed the hard way when this exact thing
          # deleted two real demo company pages. Each sync below is scoped to
          # a git-managed subtree only, so --delete there is safe (everything
          # under that prefix really is fully git-managed), and arbitrary
          # runtime-created top-level company folders are never touched by any
          # of these commands.
          aws s3 sync assets s3://swordthain-demo-sites/assets/ --delete --exclude "sites.json"
          aws s3 sync api-testing s3://swordthain-demo-sites/api-testing/ --delete
          aws s3 sync company-template s3://swordthain-demo-sites/company-template/ --delete
          aws s3 sync demos s3://swordthain-demo-sites/demos/ --delete
          aws s3 sync docs s3://swordthain-demo-sites/docs/ --delete
          aws s3 sync project-template s3://swordthain-demo-sites/project-template/ --delete
          aws s3 cp index.html s3://swordthain-demo-sites/index.html
          aws s3 cp favicon.svg s3://swordthain-demo-sites/favicon.svg
          aws s3 cp BACKLOG.md s3://swordthain-demo-sites/BACKLOG.md
          aws s3 cp CLAUDE.md s3://swordthain-demo-sites/CLAUDE.md
          aws s3 cp README.md s3://swordthain-demo-sites/README.md
          # assets/sites.json is Lambda-managed live state (every created/
          # archived company updates it) — excluded above so a deploy never
          # overwrites it with this repo's static starter copy.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and deploy Lambda
        working-directory: apps/playground/lambda
        run: |
          python3 -m pip install -r requirements.txt -t .
          zip -r ../lambda.zip . -x "*.pyc" -x "__pycache__/*" -x "README.md"
          aws lambda update-function-code \
            --function-name swordthain-automation \
            --zip-file fileb://../lambda.zip \
            --region us-east-1

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3HUQ60BN7KVJR --paths "/*"
