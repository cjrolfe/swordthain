name: Accessibility Test

on:
  workflow_run:
    workflows: ["Deploy Infra", "Deploy Media App"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: a11y-test
  cancel-in-progress: false

jobs:
  test:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: infra/a11y-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: infra/a11y-tests
        run: npx playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::584000479246:role/swordthain-a11y-test-ci
          aws-region: us-east-1

      - name: Run accessibility suite
        working-directory: infra/a11y-tests
        run: npm test

      - name: Upload failure artifacts (traces, screenshots, video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-results
          path: infra/a11y-tests/test-results/
          retention-days: 14
